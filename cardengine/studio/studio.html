<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kardix Studio</title>
  <style>
    :root {
      --ink: #1d1b22; --muted: #625c6b; --line: #e4e0ea; --panel: #f7f5fa; --page: #ffffff; --code: #fbfaf7;
      --accent: #5b3f9e; --accent-soft: #ece6f7; --bad: #b3261e; --bad-soft: #fdecea; --good: #1e7a4a; --card: #fffdf8;
      font: 16px/1.5 system-ui, "Segoe UI", sans-serif; color: var(--ink); background: var(--page);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); }
    a { color: var(--accent); }
    header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 24px; padding: 10px 20px;
      border-bottom: 1px solid var(--line); background: var(--page); }
    header b { font-size: 20px; }
    header small { color: var(--muted); margin-left: auto; font-size: 14px; }
    .tabs { display: flex; gap: 4px; }
    .tab { padding: 8px 16px; border-radius: 8px; text-decoration: none; color: var(--ink); font-weight: 600; }
    .tab:hover { background: var(--panel); }
    .tab.on { background: var(--accent-soft); color: var(--accent); }
    .bad { color: var(--bad); }
    .good { color: var(--good); }
    .failure { margin: 12px 20px; padding: 10px 14px; background: var(--bad-soft); color: var(--bad); border-radius: 8px; }
    h2 { font-size: 22px; margin: 4px 0 16px; }
    h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 20px 4px 8px; }
    .quiet { color: var(--muted); }
    i { font-style: normal; font-size: 13px; background: var(--bad); color: white; border-radius: 10px; padding: 0 7px; margin-right: 6px; }

    /* Browsing: a list down the side, the page beside it. */
    .browse { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 61px); }
    .sets { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px; }
    .sets input { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .set, .file { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 8px;
      text-decoration: none; color: var(--ink); font-weight: 600; }
    .set small { color: var(--muted); font-weight: 400; }
    .set:hover, .file:hover { background: var(--line); }
    .set.on, .file.on { background: var(--accent); color: white; }
    .set.on small { color: white; }
    .files .file { font-weight: 400; font-size: 14px; padding: 6px 10px; word-break: break-all; }
    .grid-page { padding: 20px 28px 48px; min-width: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .tile { display: block; text-decoration: none; color: var(--ink); border-radius: 14px; padding: 6px; }
    .tile:hover { background: var(--accent-soft); }
    .tile figure { margin: 0; aspect-ratio: 750 / 1050; display: grid; place-items: center; background: var(--panel); border-radius: 10px; overflow: hidden; }
    .tile img, .big img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .caption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 4px 2px; }
    .caption small { color: var(--muted); white-space: nowrap; font-size: 14px; }

    /* A card's page: the card, and its code behind. */
    .card-page { padding: 16px 28px 48px; }
    .card-bar { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
    .card-bar > a { font-weight: 600; text-decoration: none; }
    .card-bar h2 { margin: 0; }
    .steps { margin-left: auto; display: flex; gap: 12px; }
    .steps a { padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; font-weight: 600; }
    .steps a:hover { background: var(--accent-soft); }
    .card-body { display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); gap: 32px; align-items: start; }
    .pictures { position: sticky; top: 80px; }
    .big { margin: 0; aspect-ratio: 750 / 1050; display: grid; place-items: center; background: var(--panel); border-radius: 14px; overflow: hidden; }
    .big[hidden] { display: none; }
    .faces { display: flex; gap: 4px; margin-bottom: 10px; }
    .faces button { flex: 1; font: inherit; font-weight: 600; padding: 8px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--page); color: var(--ink); cursor: pointer; }
    .faces button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
    .behind h3:first-child { margin-top: 0; }
    .snippet { margin-bottom: 16px; }
    .where { display: inline-block; font-size: 14px; margin: 0 0 6px 2px; }
    .problem { margin: 6px 0; padding: 8px 12px; border-left: 3px solid var(--bad); background: var(--bad-soft); border-radius: 4px; }
    .problem.warning { border-color: #b58100; background: #fff7e0; }

    .source { font: 15px/1.6 Consolas, "Cascadia Mono", monospace; background: var(--code); border: 1px solid var(--line);
      border-radius: 8px; padding: 10px 12px 10px 56px; margin: 0; overflow-x: auto; }
    .source li { color: var(--muted); }
    .source li span { color: var(--ink); white-space: pre-wrap; }
    .source li.marked { background: var(--bad-soft); }
    .source li.here { background: var(--accent-soft); }

    .reading { max-width: 820px; padding: 20px 28px 48px; }
    .reading section h3 { text-transform: none; letter-spacing: 0; font-size: 17px; color: var(--ink); margin: 20px 0 4px; }
    .picture { max-width: 100%; border-radius: 8px; }
    .diagnostics { list-style: none; padding: 0; margin: 0; }
    .diagnostics li { padding: 8px 12px; border-left: 3px solid var(--bad); background: var(--bad-soft); margin-bottom: 6px; border-radius: 4px; }
    .diagnostics li.warning { border-color: #b58100; background: #fff7e0; }
    .diagnostics a { font-weight: 600; margin-right: 6px; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .card .art { aspect-ratio: 3 / 2; background: #ece8f2 center / cover; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
    .card .name { padding: 8px 12px 0; }
    .card .name small { display: block; color: var(--muted); font-style: italic; }
    .card .type { display: flex; justify-content: space-between; padding: 4px 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); font-weight: 600; }
    .card .stats span { margin-left: 8px; color: var(--ink); }
    .card .text { margin: 4px 12px 8px; }
    .card .flavor { margin: 0 12px 12px; font-size: 14px; font-style: italic; color: var(--muted); }
    .bad-note { color: var(--bad); font-size: 14px; padding: 12px; }

    @media (max-width: 1000px) {
      .browse { grid-template-columns: 200px minmax(0, 1fr); }
      .card-body { grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 20px; }
      .grid-page, .card-page { padding-left: 16px; padding-right: 16px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    }
    @media (max-width: 700px) {
      header { flex-wrap: wrap; gap: 8px 16px; }
      .browse, .card-body { grid-template-columns: 1fr; }
      .sets { border-right: 0; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; }
      .sets input { flex-basis: 100%; }
      .sets h3 { display: none; }
      .set { padding: 6px 12px; border: 1px solid var(--line); background: var(--page); }
      .files { display: block; max-height: 40vh; overflow: auto; }
      .files h3 { display: block; }
      .pictures { position: static; max-width: 360px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="app"><p style="padding: 20px">Loading…</p></div>
  <script type="module" src="studio.js"></script>
</body>
</html>
