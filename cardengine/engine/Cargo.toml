[package]
name = "kardix-core"
version = "0.1.0"
edition = "2024"
description = "The TCG platform's core: Alex, and in time the game loader, the runtime and the card renderer, as one WebAssembly module."
publish = false

# Every host (the browser, kardix.exe through Wasmtime, a server) runs the same module. Its only dependencies are the
# rasteriser's (src/render/raster.rs): tiny-skia to fill shapes and glyphs, and image-webp to read WebP pictures; both
# are pure Rust. Layout never uses them.
[dependencies]
image-webp = "0.2.4"
tiny-skia = "0.12.0"

[lib]
name = "kardix"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
