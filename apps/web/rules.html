<html lang="en">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#5b3417" />
    <title>Fruitcats Rulebook</title>
    <meta name="description" content="The official Fruitcats rulebook: how to play, deckbuilding, tournament play, and the comprehensive rules." />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./">
        <img src="./ui/app-icon.webp" alt="" width="40" height="40" />
        <span>Fruitcats</span>
      </a>
      <nav class="pages" aria-label="Pages">
        <a href="./rules.html" aria-current="page">Rules</a>
        <a href="./cards.html">Cards</a>
        <a class="play" href="./">Play</a>
      </nav>
    </header>
    <div class="layout">
      <nav class="toc" aria-label="Contents">
        <details id="toc">
          <summary>Contents</summary>
          <!-- doc:toc -->
        </details>
      </nav>
      <script>
        // The contents sit open beside the text on wide screens and fold away above them on phones.
        const toc = document.getElementById('toc');
        const wide = matchMedia('(min-width: 900px)');
        toc.open = wide.matches;
        wide.addEventListener('change', () => (toc.open = wide.matches));
        toc.addEventListener('click', (e) => { if (!wide.matches && e.target.closest('a')) toc.open = false; });
      </script>
      <main class="doc">
        <!-- doc:body -->
      </main>
    </div>
    <a class="to-top" href="#" aria-label="Back to top">↑</a>
  </body>
